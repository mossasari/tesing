<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>朝陇山谷子档案录入与修改</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    body { background-color: #0c0d11; color: #e2e8f0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
    .btn-chip { @apply text-xs bg-zinc-800 text-zinc-300 px-2 py-1 rounded border border-zinc-700 active:scale-95 transition-transform; }
  </style>
</head>
<body class="min-h-screen p-3 sm:p-6 flex justify-center pb-24">

  <div class="w-full max-w-xl bg-[#14151b] border border-zinc-800 rounded-xl p-4 sm:p-6 shadow-2xl flex flex-col gap-4">
    
    <!-- 顶栏标题 -->
    <div class="flex items-center justify-between border-b border-zinc-800 pb-3">
      <div>
        <h1 class="text-base sm:text-lg font-bold text-white flex items-center gap-2">
          <i data-lucide="database" class="w-5 h-5 text-cyan-400"></i>
          朝陇山周边档案管理
        </h1>
        <p class="text-xs text-zinc-500 font-mono">支持图片绑定干员TAG · 搜索智能置顶</p>
      </div>
      <a href="index.html" class="text-xs text-cyan-400 hover:underline flex items-center gap-1 font-mono">
        <i data-lucide="arrow-left" class="w-3.5 h-3.5"></i> 返回图鉴
      </a>
    </div>

    <!-- 工作模式切换 -->
    <div class="flex bg-[#181922] p-1 rounded-lg border border-zinc-800 text-xs font-medium">
      <button type="button" onclick="setMode('create')" id="tab-create" class="flex-1 py-1.5 rounded-md bg-cyan-400 text-black font-bold flex items-center justify-center gap-1.5 transition-all">
        <i data-lucide="plus-circle" class="w-3.5 h-3.5"></i> 录入新周边
      </button>
      <button type="button" onclick="setMode('edit')" id="tab-edit" class="flex-1 py-1.5 rounded-md text-zinc-400 hover:text-white flex items-center justify-center gap-1.5 transition-all">
        <i data-lucide="edit-3" class="w-3.5 h-3.5"></i> 修改已有周边 / 补图绑定
      </button>
    </div>

    <!-- 编辑模式专属下拉框 -->
    <div id="edit-selector-box" class="hidden bg-cyan-950/20 border border-cyan-800/40 p-3 rounded-lg space-y-2">
      <label class="block text-cyan-400 font-bold text-xs flex items-center justify-between">
        <span>请选择要修改/绑Tag补图的周边：</span>
        <button type="button" onclick="loadArchiveList()" class="text-[10px] text-zinc-400 hover:text-cyan-300 flex items-center gap-0.5">
          <i data-lucide="rotate-cw" class="w-3 h-3"></i> 刷新列表
        </button>
      </label>
      <select id="existing-goods-select" onchange="onSelectExistingGood(this.value)" class="w-full bg-[#181922] border border-zinc-700 rounded-lg p-2 text-white text-xs outline-none focus:border-cyan-400">
        <option value="">-- 请选择要修改的档案 --</option>
      </select>
    </div>

    <form id="entry-form" class="space-y-3.5 text-xs">

      <!-- 1. 多图上传与智能角色 Tag 绑定区 -->
      <div>
        <div class="flex justify-between items-center mb-1">
          <label class="block text-zinc-400 font-medium">周边图片 (可给每张图绑定干员名，如：陈、阿米娅)</label>
          <span id="upload-count-badge" class="text-[10px] text-cyan-400 font-mono">当前共 0 张图</span>
        </div>
        
        <label class="border border-dashed border-zinc-700 hover:border-cyan-400 rounded-lg p-3 text-center bg-[#181922] transition-colors flex items-center justify-center gap-2 Antigravity-pointer block">
          <i data-lucide="upload-cloud" class="w-4 h-4 text-cyan-400"></i>
          <span id="upload-hint" class="text-zinc-300">点击上传单张或多张图片 (自动传至 ImgBB)</span>
          <input type="file" id="image-file" accept="image/*" multiple class="hidden">
        </label>
        
        <!-- 图片画廊缩略图 + 单图 Tag 输入框 -->
        <div id="preview-grid" class="hidden mt-2 grid grid-cols-2 sm:grid-cols-3 gap-2.5 p-2 bg-[#181922] rounded-lg border border-zinc-800"></div>
      </div>

      <!-- 2. 谷子名称 -->
      <div>
        <label class="block text-zinc-400 font-medium mb-1">谷子名称 *</label>
        <input type="text" id="title" required placeholder="如：干员棋子第一弹、保持安静亚克力贴" 
               class="w-full bg-[#181922] border border-zinc-700 rounded-lg p-2.5 text-white focus:outline-none focus:border-cyan-400 text-xs sm:text-sm">
      </div>

      <!-- 3. 所属企划/系列 -->
      <div>
        <label class="block text-zinc-400 font-medium mb-1">所属企划 / 系列名 *</label>
        <input type="text" id="series" required placeholder="如：干员棋子系列第1弹、开市特惠" 
               class="w-full bg-[#181922] border border-zinc-700 rounded-lg p-2 text-zinc-200 focus:outline-none focus:border-cyan-400">
        <div class="flex gap-1.5 mt-1.5 flex-wrap">
          <span class="text-[10px] text-zinc-600 self-center">快捷填入:</span>
          <button type="button" onclick="setVal('series', '2017-2018早期展会先行物料')" class="btn-chip text-[10px]">早期物料</button>
          <button type="button" onclick="setVal('series', '朝陇山开市特惠')" class="btn-chip text-[10px]">开市特惠</button>
          <button type="button" onclick="setVal('series', '干员棋子系列第1弹')" class="btn-chip text-[10px]">棋子第1弹</button>
          <button type="button" onclick="setVal('series', '一周年纪念系列')" class="btn-chip text-[10px]">一周年</button>
        </div>
      </div>

      <!-- 4. 制品分类与发售时间 -->
      <div class="grid grid-cols-2 gap-3">
        <div>
          <label class="block text-zinc-400 font-medium mb-1">制品分类 *</label>
          <select id="category" required class="w-full bg-[#181922] border border-zinc-700 rounded-lg p-2 text-zinc-200 focus:outline-none focus:border-cyan-400">
            <option value="立牌">立牌</option>
            <option value="徽章">徽章</option>
            <option value="挂件">挂件</option>
            <option value="手办">手办</option>
            <option value="贴纸">贴纸</option>
            <option value="色纸">色纸</option>
            <option value="明信片">明信片</option>
            <option value="毛绒">毛绒玩偶</option>
            <option value="生活">生活周边</option>
            <option value="虚拟兑换">游戏内虚拟道具</option>
          </select>
        </div>

        <div>
          <label class="block text-zinc-400 font-medium mb-1">发售/活动日期 *</label>
          <input type="date" id="release_date" required value="2019-05-25" min="2017-01-01" max="2030-12-31"
                 class="w-full bg-[#181922] border border-zinc-700 rounded-lg p-1.5 text-zinc-200 focus:outline-none focus:border-cyan-400 font-mono">
        </div>
      </div>

      <!-- 5. 官方价格 -->
      <div>
        <label class="block text-zinc-400 font-medium mb-1 flex items-center justify-between">
          <span>官方发售价格 / 兑换规则</span>
          <span class="text-[10px] text-zinc-500 font-mono">支持文字或金额</span>
        </label>
        <input type="text" id="price" placeholder="如：¥79、赠品(任意单即赠)、全套限定特典、展会免费派发" 
               class="w-full bg-[#181922] border border-zinc-700 rounded-lg p-2 text-amber-300 font-medium focus:outline-none focus:border-cyan-400">
        <div class="flex gap-1.5 mt-1.5 flex-wrap">
          <span class="text-[10px] text-zinc-600 self-center">快捷填入:</span>
          <button type="button" onclick="setVal('price', '任意单即赠')" class="btn-chip text-[10px]">普赠特典</button>
          <button type="button" onclick="setVal('price', '满金额赠品')" class="btn-chip text-[10px]">满赠特典</button>
          <button type="button" onclick="setVal('price', '20')" class="btn-chip text-[10px]">20</button>
          <button type="button" onclick="setVal('price', '24')" class="btn-chip text-[10px]">24</button>
          <button type="button" onclick="setVal('price', '32')" class="btn-chip text-[10px]">32</button>
          <button type="button" onclick="setVal('price', '展会活动奖励')" class="btn-chip text-[10px]">展会活动</button>
        </div>
      </div>

      <!-- 6. 涉及干员 -->
      <div>
        <label class="block text-zinc-400 font-medium mb-1">涉及干员 (多位用逗号分隔)</label>
        <input type="text" id="operators" oninput="syncOpListToImageTags()" placeholder="如：陈, 阿米娅, 凯尔希" 
               class="w-full bg-[#181922] border border-zinc-700 rounded-lg p-2 text-zinc-200 focus:outline-none focus:border-cyan-400">
        <div class="flex gap-1.5 mt-1.5 flex-wrap">
          <span class="text-[10px] text-zinc-600 self-center">常用干员:</span>
          <button type="button" onclick="appendOp('阿米娅')" class="btn-chip text-[10px]">+阿米娅</button>
          <button type="button" onclick="appendOp('陈')" class="btn-chip text-[10px]">+陈</button>
          <button type="button" onclick="appendOp('凯尔希')" class="btn-chip text-[10px]">+凯尔希</button>
          <button type="button" onclick="appendOp('银灰')" class="btn-chip text-[10px]">+银灰</button>
          <button type="button" onclick="appendOp('能天使')" class="btn-chip text-[10px]">+能天使</button>
          <button type="button" onclick="appendOp('德克萨斯')" class="btn-chip text-[10px]">+德克萨斯</button>
        </div>
      </div>

      <!-- 7. 规格与获取途径 -->
      <div class="grid grid-cols-2 gap-3">
        <div>
          <label class="block text-zinc-400 font-medium mb-1">材质 / 规格</label>
          <input type="text" id="material" placeholder="如：亚克力、锌合金、PVC" 
                 class="w-full bg-[#181922] border border-zinc-700 rounded-lg p-2 text-zinc-200 focus:outline-none focus:border-cyan-400">
        </div>
        <div>
          <label class="block text-zinc-400 font-medium mb-1">获取途径 / 渠道</label>
          <input type="text" id="obtain_type" placeholder="如：官方淘宝预售、CP21现场" 
                 class="w-full bg-[#181922] border border-zinc-700 rounded-lg p-2 text-zinc-200 focus:outline-none focus:border-cyan-400">
        </div>
      </div>

      <!-- 8. 特典标记与考据备注 -->
      <div class="flex items-center gap-2 pt-1">
        <input type="checkbox" id="is_limited" class="w-4 h-4 rounded bg-[#181922] border-zinc-700 text-cyan-400">
        <label for="is_limited" class="text-zinc-300 Antigravity-pointer">属于非单售/限定/绝版特典</label>
      </div>

      <div>
        <label class="block text-zinc-400 font-medium mb-1">历史背景 / 考据笔记</label>
        <textarea id="note" rows="2" placeholder="如：2019年5月25日开店特惠期满赠，随10月出货附赠..." 
                  class="w-full bg-[#181922] border border-zinc-700 rounded-lg p-2 text-zinc-200 focus:outline-none focus:border-cyan-400"></textarea>
      </div>

      <button type="submit" id="submit-btn" 
              class="w-full py-3 mt-2 bg-cyan-400 hover:bg-cyan-300 text-black font-bold rounded-lg tracking-wider text-sm shadow-[0_0_15px_rgba(34,211,238,0.2)] active:scale-[0.99] transition-all flex items-center justify-center gap-2">
        <i data-lucide="check" class="w-4 h-4"></i> 确认并录入新周边
      </button>

    </form>
  </div>

  <script>
    const SUPABASE_URL = 'https://ybheoetxyihxiwtjtrql.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InliaGVvZXR4eWloeGl3dGp0cnFsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTIyNDk0OTcsImV4cCI6MjEwNzgyNTQ5N30.1W9VSg1KX8ucwBeeimCpCtsOjBzcVxxtTtroeEl1i50';
    const IMGBB_API_KEY = 'f134ab35c1ff2009ff341ad408dcf4b5';

    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    lucide.createIcons();

    let currentMode = 'create';
    let currentEditId = null;
    // 🌟 图片列表现在存放对象：[{ url: 'http...', tag: '陈' }, { url: 'http...', tag: '全家福' }]
    let uploadedImageList = [];
    let cachedGoodsList = [];

    function setVal(id, text) { document.getElementById(id).value = text; }
    function appendOp(name) {
      const el = document.getElementById('operators');
      const val = el.value.trim();
      el.value = val ? val + ', ' + name : name;
      syncOpListToImageTags();
    }

    function setMode(mode) {
      currentMode = mode;
      const btnCreate = document.getElementById('tab-create');
      const btnEdit = document.getElementById('tab-edit');
      const editBox = document.getElementById('edit-selector-box');
      const submitBtn = document.getElementById('submit-btn');

      if (mode === 'create') {
        currentEditId = null;
        btnCreate.className = 'flex-1 py-1.5 rounded-md bg-cyan-400 text-black font-bold flex items-center justify-center gap-1.5 transition-all';
        btnEdit.className = 'flex-1 py-1.5 rounded-md text-zinc-400 hover:text-white flex items-center justify-center gap-1.5 transition-all';
        editBox.classList.add('hidden');
        submitBtn.innerHTML = '<i data-lucide="check" class="w-4 h-4"></i> 确认并录入新周边';
        resetForm();
      } else {
        btnEdit.className = 'flex-1 py-1.5 rounded-md bg-cyan-400 text-black font-bold flex items-center justify-center gap-1.5 transition-all';
        btnCreate.className = 'flex-1 py-1.5 rounded-md text-zinc-400 hover:text-white flex items-center justify-center gap-1.5 transition-all';
        editBox.classList.remove('hidden');
        submitBtn.innerHTML = '<i data-lucide="save" class="w-4 h-4"></i> 保存修改与补图';
        loadArchiveList();
      }
      lucide.createIcons();
    }

    async function loadArchiveList() {
      const select = document.getElementById('existing-goods-select');
      select.innerHTML = '<option value="">正在同步档案列表...</option>';
      try {
        const { data, error } = await supabaseClient
          .from('arknights_goods')
          .select('*')
          .order('release_date', { ascending: false });

        if (error) throw error;
        cachedGoodsList = data || [];

        select.innerHTML = '<option value="">-- 请选择要补图/修改的谷子 (' + cachedGoodsList.length + '条) --</option>' + 
          cachedGoodsList.map(g => `<option value="${g.id}">[${g.release_date||'早期'}] ${g.title} (${g.series||'企划'})</option>`).join('');

        if (currentEditId) select.value = currentEditId;
      } catch (err) {
        select.innerHTML = '<option value="">加载失败，请重试</option>';
      }
    }

    function onSelectExistingGood(id) {
      if (!id) {
        currentEditId = null;
        return;
      }
      const item = cachedGoodsList.find(x => String(x.id) === String(id));
      if (!item) return;

      currentEditId = item.id;
      document.getElementById('title').value = item.title || '';
      document.getElementById('series').value = item.series || '';
      document.getElementById('category').value = item.category || '立牌';
      document.getElementById('release_date').value = item.release_date || '2019-05-25';
      document.getElementById('price').value = item.price || '';
      document.getElementById('operators').value = (item.operators || []).join(', ');
      document.getElementById('material').value = item.material || '';
      document.getElementById('obtain_type').value = item.obtain_type || '';
      document.getElementById('is_limited').checked = !!item.is_limited;
      document.getElementById('note').value = item.note || '';

      // 解析兼容旧数据：无论旧数据是纯字符串还是对象，统统转为带 tag 的对象
      uploadedImageList = [];
      const rawImgs = (item.images && item.images.length > 0) ? item.images : (item.cover_url ? [item.cover_url] : []);
      
      rawImgs.forEach((img, i) => {
        if (typeof img === 'string') {
          // 如果第一张没写标签，默认叫封面；其余如果录过干员可以尝试自动对齐
          uploadedImageList.push({ url: img, tag: i === 0 ? '全家福/封面' : '' });
        } else if (typeof img === 'object' && img.url) {
          uploadedImageList.push({ url: img.url, tag: img.tag || '' });
        }
      });

      renderPreview();
    }

    const fileInput = document.getElementById('image-file');
    const uploadHint = document.getElementById('upload-hint');
    const previewGrid = document.getElementById('preview-grid');
    const countBadge = document.getElementById('upload-count-badge');

    fileInput.addEventListener('change', async (e) => {
      const files = Array.from(e.target.files);
      if (!files.length) return;

      uploadHint.textContent = `⏳ 正在上传 ${files.length} 张图片到图床...`;

      for (let i = 0; i < files.length; i++) {
        const formData = new FormData();
        formData.append('image', files[i]);
        try {
          const res = await fetch(`https://api.imgbb.com/1/upload?key=${IMGBB_API_KEY}`, {
            method: 'POST',
            body: formData
          });
          const json = await res.json();
          if (json.success) {
            // 新上传的图片自动入列
            uploadedImageList.push({
              url: json.data.url,
              tag: uploadedImageList.length === 0 ? '全家福/封面' : ''
            });
          }
        } catch (err) {
          console.error('单张上传失败', err);
        }
      }

      uploadHint.textContent = '点击继续追加更多图片';
      renderPreview();
      fileInput.value = '';
    });

    // 渲染图片画廊 + 每张图专属的 Tag 输入框与快捷填入
    function renderPreview() {
      if (uploadedImageList.length > 0) {
        previewGrid.classList.remove('hidden');
      } else {
        previewGrid.classList.add('hidden');
      }
      countBadge.textContent = `当前共 ${uploadedImageList.length} 张图`;

      // 获取当前填入的干员列表作为快捷按钮
      const curOps = document.getElementById('operators').value.split(/[,，]/).map(s=>s.trim()).filter(Boolean);

      previewGrid.innerHTML = uploadedImageList.map((item, idx) => `
        <div class="relative bg-zinc-900/90 rounded-lg border ${idx===0 ? 'border-cyan-400' : 'border-zinc-700'} p-1.5 flex flex-col gap-1.5 overflow-hidden">
          <div class="relative aspect-square w-full rounded overflow-hidden bg-black flex items-center justify-center">
            <img src="${item.url}" class="w-full h-full object-cover">
            ${idx===0 ? '<span class="absolute top-1 left-1 bg-cyan-400 text-black text-[9px] font-bold px-1 rounded shadow">默认主封</span>' : ''}
            <button type="button" onclick="removeImg(${idx})" class="absolute top-1 right-1 bg-red-600/90 text-white rounded-full w-4 h-4 flex items-center justify-center text-[10px] hover:scale-110">✕</button>
          </div>
          
          <!-- 🌟 单图 Tag 绑定输入框 -->
          <div class="flex flex-col gap-1">
            <input type="text" value="${item.tag || ''}" oninput="updateImgTag(${idx}, this.value)" placeholder="绑定角色名(如:陈)" class="w-full bg-[#14151b] border border-zinc-700 focus:border-cyan-400 rounded px-1.5 py-0.5 text-[11px] text-cyan-300 font-mono outline-none">
            
            <!-- 快捷干员微芯片 (点击一秒给这张图打标) -->
            ${curOps.length > 0 ? `
              <div class="flex gap-1 overflow-x-auto no-scrollbar">
                ${curOps.map(op => `
                  <button type="button" onclick="quickSetImgTag(${idx}, '${op}')" class="text-[9px] px-1 py-0.2 rounded bg-zinc-800 hover:bg-cyan-950 hover:text-cyan-400 text-zinc-400 shrink-0 font-mono border border-zinc-700">
                    +${op}
                  </button>
                `).join('')}
              </div>
            ` : ''}
          </div>
        </div>
      `).join('');
    }

    window.updateImgTag = function(idx, tag) {
      if (uploadedImageList[idx]) {
        uploadedImageList[idx].tag = tag.trim();
      }
    };

    window.quickSetImgTag = function(idx, op) {
      if (uploadedImageList[idx]) {
        uploadedImageList[idx].tag = op;
        renderPreview();
      }
    };

    window.syncOpListToImageTags = function() {
      // 当修改了干员列表，刷新图片快捷候选
      renderPreview();
    };

    window.removeImg = function(idx) {
      uploadedImageList.splice(idx, 1);
      renderPreview();
    };

    function resetForm() {
      document.getElementById('title').value = '';
      document.getElementById('price').value = '';
      document.getElementById('operators').value = '';
      document.getElementById('material').value = '';
      document.getElementById('obtain_type').value = '';
      document.getElementById('is_limited').checked = false;
      document.getElementById('note').value = '';
      uploadedImageList = [];
      renderPreview();
      uploadHint.textContent = '点击拍照或从相册选图 (可多选)';
    }

    const form = document.getElementById('entry-form');
    const submitBtn = document.getElementById('submit-btn');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();

      if (currentMode === 'edit' && !currentEditId) {
        return alert("⚠️ 请先在上方下拉框中选择要修改哪一条谷子！");
      }

      const releaseDate = document.getElementById('release_date').value;
      const parsedYear = new Date(releaseDate).getFullYear();

      const opsText = document.getElementById('operators').value;
      const operators = opsText ? opsText.split(/[,，]/).map(s => s.trim()).filter(Boolean) : [];

      // 处理主封面：默认第一张
      const defaultCover = uploadedImageList[0] ? (uploadedImageList[0].url || uploadedImageList[0]) : 'https://placehold.co/400x400/18181b/fbbf24?text=暂无图片';

      const payload = {
        title: document.getElementById('title').value.trim(),
        series: document.getElementById('series').value.trim(),
        category: document.getElementById('category').value,
        release_date: releaseDate,
        year: parsedYear,
        price: document.getElementById('price').value.trim() || '未标明',
        operators: operators,
        material: document.getElementById('material').value.trim(),
        obtain_type: document.getElementById('obtain_type').value.trim(),
        is_limited: document.getElementById('is_limited').checked,
        note: document.getElementById('note').value.trim(),
        cover_url: defaultCover,
        // 🌟 核心：完整存储带 Tag 的图片数组结构！
        images: uploadedImageList
      };

      submitBtn.disabled = true;
      submitBtn.innerText = '正在提交至云端...';

      try {
        if (currentMode === 'create') {
          const { error } = await supabaseClient.from('arknights_goods').insert([payload]);
          if (error) throw error;
          alert(`🎉 成功收录新周边：[${payload.title}]！`);
          resetForm();
        } else {
          const { data, error } = await supabaseClient
            .from('arknights_goods')
            .update(payload)
            .eq('id', currentEditId)
            .select();

          if (error) throw error;
          alert(`✅ [${payload.title}] 档案更新/角色Tag绑定成功！`);
          await loadArchiveList();
        }
      } catch (err) {
        alert('❌ 操作失败: ' + err.message);
      } finally {
        submitBtn.disabled = false;
        submitBtn.innerHTML = currentMode === 'create' 
          ? '<i data-lucide="check" class="w-4 h-4"></i> 确认并录入新周边' 
          : '<i data-lucide="save" class="w-4 h-4"></i> 保存修改与补图';
        lucide.createIcons();
      }
    });
  </script>
</body>
</html>
